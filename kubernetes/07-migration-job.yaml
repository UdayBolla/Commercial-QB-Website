apiVersion: batch/v1
kind: Job
metadata:
  name: qbshop-migration-job
  namespace: qbshop
  labels:
    app: qbshop-migration
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: qbshop-migration
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migration
        image: doc201/qbshop-migration:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: qbshop-config
